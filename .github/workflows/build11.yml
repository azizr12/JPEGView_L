name: Build Portable JPEGView

on:
  push:
    branches:
      - master
      - azizr12-patch-3
  pull_request:
    branches:
      - master
      - azizr12-patch-3
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build-portable:
    name: Build Portable ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win32
            arch: x86
            config: Release
          - platform: x64
            arch: x64
            config: Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: ${{ matrix.arch }}

      - name: Patch Post-Build Script (Ignore Missing Optional DLLs)
        shell: powershell
        run: |
          # The repo is currently missing some optional DLLs (like 7z.dll, jxl_dec.dll). 
          # This patch modifies the post-build script to return success (exit 0) even if 
          # xcopy fails to find them, allowing the build to finish successfully.
          $scriptPath = "extras\scripts\JPEGView.vcxproj-postbuild-event.bat"
          if (Test-Path $scriptPath) {
              $content = Get-Content $scriptPath -Raw
              $content = $content -replace 'exit /b %ErrorLevel%', 'exit /b 0'
              Set-Content $scriptPath -Value $content
              Write-Host "Successfully patched post-build script to ignore missing file errors."
          } else {
              Write-Host "Post-build script not found, proceeding anyway."
          }

      - name: Build Main Application and Dependencies
        shell: cmd
        run: |
          msbuild.exe src\JPEGView.sln ^
            /target:JPEGView;WICLoader ^
            /p:Platform=${{ matrix.platform }} ^
            /p:Configuration=${{ matrix.config }} ^
            /p:RestorePackagesConfig=true ^
            /m ^
            /verbosity:minimal

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPEGView-Portable-${{ matrix.platform }}
          path: |
            src/JPEGView/bin/**/${{ matrix.config }}/*.exe
            src/JPEGView/bin/**/${{ matrix.config }}/*.dll
            src/JPEGView/bin/**/${{ matrix.config }}/*.pdb
            src/JPEGView/bin/**/${{ matrix.config }}/*.txt
          if-no-files-found: error
          retention-days: 14
